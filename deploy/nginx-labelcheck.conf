# labelcheck vhost — installed as /etc/nginx/sites-available/labelcheck.conf with a
# sites-enabled symlink. Removing both and reloading nginx is the complete undo.
#
# Own file, exact server_name. nginx matches an exact server_name ahead of the portfolio's
# wildcard-regex vhost, so labelcheck takes over this one hostname without the shared
# static-portfolio config being edited at all. Teardown is: remove the symlink, nginx -t,
# reload — and the hostname falls back to the wildcard vhost.
#
# @@FULLCHAIN@@ and @@PRIVKEY@@ are substituted by deploy/deploy.sh, which reads every
# certificate `nginx -T` reports and keeps the one that actually covers this hostname
# (openssl -checkhost). They are never guessed: on a box serving dozens of other sites, a
# wrong certificate path is a browser warning for all of them.

server {
    # HTTP/2 is requested as a listen parameter rather than with the newer `http2 on;`
    # directive: the box runs nginx 1.24, where `http2 on;` is an unknown directive and
    # `nginx -t` fails outright. Verified against the box's own binary and full config.
    # nginx logs "protocol options redefined for 0.0.0.0:443" because the sibling vhosts
    # already set these options on the same socket — a warning, not an error, and one the
    # existing config already emits for six other sites.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name labelcheck.apps.smolkin.org;

    ssl_certificate     @@FULLCHAIN@@;
    ssl_certificate_key @@PRIVKEY@@;

    # The app caps uploads at 12 MiB (LABELCHECK_MAX_UPLOAD_BYTES); nginx is set slightly
    # above it so the app returns its own plain-English 413 rather than nginx's HTML one.
    client_max_body_size 16m;
    client_body_timeout  120s;

    access_log /var/log/nginx/labelcheck.access.log;
    error_log  /var/log/nginx/labelcheck.error.log;

    location / {
        proxy_pass http://127.0.0.1:8712;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A single image can take ~5 s to check and a 300-image batch is polled, never
        # held open; 120 s is generous headroom for the slowest upload, not for streaming.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name labelcheck.apps.smolkin.org;
    return 301 https://$host$request_uri;
}
